
deployment:
  webapp:
    replicaCount: 2

    image:
      repository: registry.example.com/my-app/webapp
      tag: "short-commit-hash-version"
      pullPolicy: IfNotPresent

    containerPort: 3000

    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3

  api:
    replicaCount: 2

    image:
      repository: registry.example.com/my-app/api
      tag: "short-commit-hash-version"
      pullPolicy: IfNotPresent

    containerPort: 8080

    env:
      - name: DATABASE_CONNECTION_STRING
        valueFrom:
          configMapKeyRef:
            name: api-db-config
            key: connectionString

    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3


service:
  webapp:
    type: ClusterIP
    port: 80
    targetPort: 3000

  api:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8080


ingress:
  webapp:
    enabled: true
    className: nginx

    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /

    hosts:
      - host: webapp.example.com
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 80

    tls: []


configMap:
  api:
    enabled: true
    name: api-db-config
    data:
      # can be set when using helm install (with --set)
      connectionString: 

